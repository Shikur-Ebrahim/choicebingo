services:
  choicebingo-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: choicebingo-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    depends_on:
      - choicebingo-api

  choicebingo-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: choicebingo-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./api/.env
